<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NordNest</title>
<style>
  :root{--bg:#1c1c1c;--ink:#f2f2f2;--dim:rgba(242,242,242,.55);--btn:rgba(255,255,255,.08);--btn-h:rgba(255,255,255,.16)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0 0 64px;display:flex;align-items:center;justify-content:center;padding:16px}
  #book{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  #book:active{cursor:grabbing}
  .stf__parent{background:transparent}
  .page{background:var(--bg);box-shadow:0 16px 48px rgba(0,0,0,.45)}
  .page img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
  .bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px env(safe-area-inset-bottom)}
  .bar button{width:48px;height:48px;border:0;border-radius:50%;background:var(--btn);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:background .2s}
  .bar button:hover{background:var(--btn-h)}
  .bar button:disabled{opacity:.3;cursor:default;background:var(--btn)}
  .bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #cnt{min-width:72px;text-align:center;color:var(--dim);font-variant-numeric:tabular-nums}
  #load{position:fixed;inset:0;display:grid;place-items:center;color:var(--dim)}
</style>
</head>
<body>
<div id="load">Загрузка…</div>
<div class="stage"><div id="book"></div></div>
<div class="bar">
  <button id="prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span id="cnt">1 / 13</span>
  <button id="next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button id="fs" aria-label="На весь экран"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
  var N = 13, W = 540, H = 960;
  // страница 9:16 целиком влезает в сцену; на широком экране разворот из двух страниц
  var st = document.querySelector('.stage'), sw = st.clientWidth - 32, sh = st.clientHeight - 32;
  var spread = sw / sh > 1.1 ? 2 : 1, ph = Math.floor(Math.min(sh, sw / spread * H / W)), pw = Math.floor(ph * W / H);
  var el = document.getElementById('book');
  el.style.width = (pw * spread) + 'px';
  // страницы — <img>, а не canvas: браузер берёт резкий файл под плотность экрана (canvas рисовал в css-пикселях)
  var pages = [];
  for (var i = 1; i <= N; i++) {
    var n = String(i).padStart(2, '0'), d = document.createElement('div');
    d.className = 'page';
    d.innerHTML = '<img src="p/' + n + '.jpg" srcset="p/' + n + '.jpg 1080w, p/hi/' + n + '.jpg 1620w" sizes="' + pw + 'px" alt="Страница ' + i + '" decoding="async">';
    pages.push(d);
  }
  var book = new St.PageFlip(el, {
    width: pw, height: ph, size: 'fixed',
    showCover: true, usePortrait: true, maxShadowOpacity: .5, flippingTime: 700,
    useMouseEvents: false
  });
  var cnt = document.getElementById('cnt'), prev = document.getElementById('prev'), next = document.getElementById('next');
  function upd() {
    var i = book.getCurrentPageIndex(), o = book.getOrientation() === 'landscape';
    var a = i + 1, b = o && i > 0 && i < N - 1 ? i + 2 : null;
    cnt.textContent = (b ? a + '–' + b : a) + ' / ' + N;
    prev.disabled = i === 0; next.disabled = i >= N - (o && i > 0 ? 2 : 1);
  }
  // своё управление вместо встроенного: у библиотеки сгиб идёт от точки касания,
  // поэтому нормально листается только с угла. Здесь хват в любой точке переносится
  // на внешний край страницы; тап по половине листает, быстрый свайп доводит лист.
  var g = null;
  function loc(e) { var r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: Math.max(1, Math.min(ph - 1, e.clientY - r.top)) }; }
  el.addEventListener('pointerdown', function (e) {
    if (g || e.button > 0) return;
    var p = loc(e), bw = el.clientWidth, fwd = p.x > bw / 2;
    g = { id: e.pointerId, sx: p.x, t: Date.now(), ex: fwd ? bw - 2 : 2, fwd: fwd, touch: e.pointerType !== 'mouse' };
    el.setPointerCapture(e.pointerId);
    book.startUserTouch({ x: g.ex, y: p.y });
  });
  el.addEventListener('pointermove', function (e) {
    if (!g || e.pointerId !== g.id) return;
    var p = loc(e);
    book.userMove({ x: g.ex + p.x - g.sx, y: p.y }, g.touch);
  });
  function end(e) {
    if (!g || e.pointerId !== g.id) return;
    var p = loc(e), dx = p.x - g.sx, bw = el.clientWidth, x = g.ex + dx;
    // протянул на четверть страницы или быстро свайпнул в сторону листания — дотянуть лист до конца
    var ad = Math.abs(dx);
    if ((dx < 0) === g.fwd && (ad > pw / 4 || (ad > 24 && Date.now() - g.t < 400))) {
      x = g.fwd ? -bw : bw * 2;
      book.userMove({ x: x, y: p.y }, g.touch);
    }
    book.userStop({ x: x, y: p.y });
    g = null;
  }
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
  // размер считается при открытии; перестраиваем только при смене ширины (поворот, окно):
  // на телефоне высота прыгает от адресной строки
  var rt, w0 = innerWidth; addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (Math.abs(innerWidth - w0) > 40) location.reload(); }, 400); });
  book.on('init', function () { document.getElementById('load').remove(); upd(); });
  book.on('flip', upd); book.on('changeOrientation', upd);
  book.loadFromHTML(pages);
  prev.onclick = function () { book.flipPrev(); };
  next.onclick = function () { book.flipNext(); };
  addEventListener('keydown', function (e) { if (e.key === 'ArrowRight') book.flipNext(); if (e.key === 'ArrowLeft') book.flipPrev(); });
  document.getElementById('fs').onclick = function () {
    var d = document; if (!d.fullscreenElement) (d.documentElement.requestFullscreen || function(){}).call(d.documentElement); else d.exitFullscreen();
  };
</script>
</body>
</html>
